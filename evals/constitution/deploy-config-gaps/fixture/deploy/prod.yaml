# Production values, applied by .github/workflows/deploy.yml:
#   helm upgrade --install api ./chart -f deploy/prod.yaml --set image.tag=$GITHUB_SHA
image:
  repository: 491820365514.dkr.ecr.eu-west-1.amazonaws.com/acme-api
replicas: 4
env:
  APP_ENV: production
  PUBLIC_URL: https://api.acme.io
  DATABASE_HOST: acme-prod.cluster-c8x2k1q9z0ab.eu-west-1.rds.amazonaws.com
  S3_UPLOADS_BUCKET: acme-prod-uploads
  STRIPE_MODE: live
secrets:
  databasePassword: arn:aws:secretsmanager:eu-west-1:491820365514:secret:prod/api/db-password-Xk29Qa
  stripeKey: arn:aws:secretsmanager:eu-west-1:491820365514:secret:prod/api/stripe-key-p0LmZ1
resources:
  requests: {cpu: 500m, memory: 512Mi}
  limits: {cpu: "1", memory: 1Gi}
ingress:
  host: api.acme.io
  certificateArn: arn:aws:acm:eu-west-1:491820365514:certificate/2f6c1e0a-7b1d-4c3e-9a0f-5d8e2b7c4a61
