[project]
name = "tallyho"
version = "0.31.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.0",
  "psycopg[binary]>=3.1",
  "celery[redis]>=5.3",
  "stripe>=9.0",
]

[dependency-groups]
dev = ["pytest", "pytest-django", "factory-boy", "ruff", "mypy", "django-stubs"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
